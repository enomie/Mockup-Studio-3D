<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 255 330.5">
  <!--
    Wheel Car lathe profile — units: millimeters.
    x: along wheel axle (tire width 255).
    y: SVG down; lathe axis at y=330.5 (wheel center / r=0).
    y=0: outer tread (r=outerRadius 330.5 mm).
    radial distance r = 330.5 - y.

    Stroke colors (import target, like pen-marker.svg):
      #000000 — tire rubber
      #ff0000 — rim metal
    Speichen: not in SVG (procedural in engine).
  -->
  <defs>
    <style>
      .tire {
        fill: none;
        stroke: #000;
        stroke-miterlimit: 10;
      }

      .rim {
        fill: none;
        stroke: #f00;
        stroke-miterlimit: 10;
      }

      .guide {
        fill: none;
        stroke: #ccc;
        stroke-dasharray: 2 2;
      }
    </style>
  </defs>
  <g id="wheel-car-profile">
    <!-- Lathe axis (guide only) -->
    <line class="guide" x1="0" y1="330.5" x2="255" y2="330.5"/>

    <!-- Tire: r 254..330.5 (sidewall + tread), shoulder fillet 3.5 mm -->
    <path
      class="tire"
      d="M 0,76.5
         H 255
         V 3.5
         A 3.5,3.5 0 0 1 251.5,0
         H 3.5
         A 3.5,3.5 0 0 1 0,3.5
         V 76.5
         Z"
    />

    <!-- Rim barrel: r 0..254, inset 10 mm each side (barrel length 235) -->
    <path
      class="rim"
      d="M 10,330.5
         H 245
         V 76.5
         H 10
         Z"
    />

    <!-- Hub cap (+X end): r 0..48, depth 25 mm along axle -->
    <path
      class="rim"
      d="M 220,330.5
         H 245
         V 282.5
         H 220
         Z"
    />
  </g>
</svg>
